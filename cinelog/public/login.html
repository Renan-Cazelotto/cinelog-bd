<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Entrar – CineLog</title>
</head>
<body class="centralizado">
  <main class="cartao">
    <h1 class="logo grande">CineLog</h1>
    <p class="suave">Entre na sua conta para avaliar filmes.</p>

    <div class="abas" role="tablist">
      <button role="tab" id="aba-entrar" aria-selected="true" aria-controls="painel-entrar">Entrar</button>
      <button role="tab" id="aba-cadastro" aria-selected="false" aria-controls="painel-cadastro">Criar conta</button>
    </div>

    <form id="painel-entrar" role="tabpanel" aria-labelledby="aba-entrar" class="formulario">
      <label>E-mail <input name="email" type="email" required autocomplete="username"></label>
      <label>Senha <input name="senha" type="password" required autocomplete="current-password"></label>
      <p class="erro" id="erro-entrar" role="alert"></p>
      <button type="submit" class="primario cheio">Entrar</button>
    </form>

    <form id="painel-cadastro" role="tabpanel" aria-labelledby="aba-cadastro" class="formulario" hidden>
      <label>Nome <input name="nome" required minlength="2" maxlength="100" autocomplete="name"></label>
      <label>E-mail <input name="email" type="email" required maxlength="30" autocomplete="email"></label>
      <label>Telefone (com DDD) <input name="telefone" type="tel" required placeholder="19 99999-9999" autocomplete="tel"></label>
      <label>Senha (mínimo 8 caracteres) <input name="senha" type="password" required minlength="8" maxlength="72" autocomplete="new-password"></label>
      <label>Plano <select name="plano" id="plano" required></select></label>
      <p class="erro" id="erro-cadastro" role="alert"></p>
      <button type="submit" class="primario cheio">Criar conta</button>
    </form>
  </main>
  <div id="aviso" class="aviso" role="status"></div>
  <script src="js/comum.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
